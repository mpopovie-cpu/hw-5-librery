spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.data.mongodb.uri=mongodb://localhost:27017/migration_db

# DISABLE AUTO-RUNNING BATCH JOBS
spring.batch.job.enabled=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,logfile
management.endpoint.health.show-details=always
management.endpoint.logfile.path=/tmp/spring.log
