<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Genres</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout :: nav}"></div>
<main>
    <h1>Genres</h1>
    <ul>
        <li th:each="genre : ${genres}" th:text="${genre.name}">Genre</li>
    </ul>
    <p th:if="${#lists.isEmpty(genres)}">No genres yet</p>
    <p><a th:href="@{/books}">Back to books</a></p>
</main>
</body>
</html>
