<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1 th:text="${book.id == null ? 'Add Book' : 'Edit Book'}"></h1>

<form id="book-form">

    <input type="hidden" id="bookId" th:value="${book.id}">

    <label for="title">Title:</label>
    <input type="text" id="title" th:value="${book.title}">

    <br><br>

    <label for="authorId">Author:</label>
    <select id="authorId">
        <option th:each="author : ${authors}"
                th:value="${author.id}"
                th:text="${author.fullName}"
                th:selected="${author.id == book.authorId}">
        </option>
    </select>

    <br><br>

    <label for="genreId">Genre:</label>
    <select id="genreId">
        <option th:each="genre : ${genres}"
                th:value="${genre.id}"
                th:text="${genre.name}"
                th:selected="${genre.id == book.genreId}">
        </option>
    </select>

    <br><br>

    <p id="error" th:text="${error}"></p>

    <button type="submit">Save</button>
    <a href="/books">Cancel</a>

</form>

<script src="/css/js/book-form.js"></script>

</body>
</html>
