<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout :: nav}"></div>
<main>
    <h1>Authors</h1>
    <ul>
        <li th:each="author : ${authors}" th:text="${author.fullName}">Author</li>
    </ul>
    <p th:if="${#lists.isEmpty(authors)}">No authors yet</p>
    <p><a th:href="@{/books}">Back to books</a></p>
</main>
</body>
</html>
