services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  recommendation-service:
    build:
      context: .
      dockerfile: ./recommendation-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mongodb

  main-app:
    build:
      context: .
    ports:
      - "8081:8081"
    environment:
      - SERVICES_RECOMMENDATION_URL=http://recommendation-service:8080
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/migration_db
    depends_on:
      - mongodb
      - recommendation-service

volumes:
  mongo_data:
